[package]
name = "panelink"
version = "0.1.8"
edition = "2021"
license = "MIT"
publish = false

[target.'cfg(unix)'.dependencies]
vt100 = { version = "=0.16.2-panelink.2", path = "vendor/vt100" }
rustix-openpty = "=0.2.0"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process", "termios"] }
unicode-width = "=0.2.3"
crossterm-input = { version = "=0.29.0-panelink.1", path = "vendor/crossterm-input" }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
signal-hook = { version = "=0.4.5", default-features = false }
libc = { version = "=0.2.191", default-features = false }
rustix = { version = "=1.1.5", default-features = false, features = ["net"] }
